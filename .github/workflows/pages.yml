# Vitrine publique : publie web/ + data/ sur GitHub Pages (https://alpharid.github.io/ACH/).
# Le site déployé met data/ à côté de la page ; app.js essaie ../data/ puis data/.
name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-catalog.mjs
      - name: Assemble site
        run: |
          mkdir _site
          cp -r web/. _site/
          cp -r data _site/data
          rm -f _site/data/catalog.schema.md
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
